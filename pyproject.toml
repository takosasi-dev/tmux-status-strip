[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statusstrip"
version = "0.1.0"
description = "tmux の帯に CPU・メモリ・CI の結果などを1行で出すコマンド"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
statusstrip = "statusstrip.__main__:main"

[project.urls]
Homepage = "https://github.com/takosasi-dev/tmux-status-strip"

[tool.setuptools]
packages = ["statusstrip"]
